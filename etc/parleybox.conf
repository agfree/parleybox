# ParleyBox web server configuration.  Installed to /etc/parleybox/parleybox.conf
# Restart with: sudo systemctl restart parleybox

[parleybox]
site_name = ParleyBox
# Portal hostname. dnsmasq answers every DNS query with the box's IP, so any
# name works; this one is printed in the UI and used for captive-portal redirects.
hostname = parleybox.lan
listen = 0.0.0.0
port = 80

share_dir = /srv/parleybox/share
# upload_dir defaults to <share_dir>/uploads
upload_dir =
data_dir = /srv/parleybox/data

uploads_enabled = true
max_upload_mb = 2048

chat_enabled = true
chat_history = 500

board_enabled = true
board_images = true
board_max_threads = 200
board_max_replies = 500

# Redirect requests for unknown hostnames (and OS connectivity probes) to the
# portal page. Set to false if you only want the box reachable by its address.
captive_portal = true
# Extra hostnames that should be served directly instead of redirected
extra_hosts =

# Message of the day, shown on the home page. Use \n for newlines.
motd = Welcome aboard. This box is not connected to the internet.\nEverything here is shared anonymously by the people around you.\nTake what you need, leave something behind.
